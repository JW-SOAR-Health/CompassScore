version: '3.8'

services:
  fastapi:
    container_name: scoring_api
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - GOOGLE_APPLICATION_CREDENTIALS=/app/key.json
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
      - ~/.aws:/root/.aws
      - ./key.json:/app/key.json
    restart: on-failure
    command: ./entrypoint.sh
    networks:
      - app-network

networks:
  app-network:
    external: true
