[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
  | migrations
  | .*/migrations
  | \.aws
  | shared_db/*
  | app/tests/*
)/
'''

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
  | migrations
  | .*/migrations
  | \.aws
  | shared_db/*
  | .*/app/tests/*
)/
'''

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
