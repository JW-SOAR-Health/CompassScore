[mypy]
plugins = sqlalchemy.ext.mypy.plugin
exclude = (*\/)?tests\/.*,(*\/)?versions\/.*

[mypy-alembic.env]
ignore_errors = True

[mypy-requests]
ignore_missing_imports = True

[mypy-google-cloud-storage]
ignore_missing_imports = True

[mypy-*.tests.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

[mypy-*.versions.*]
ignore_errors = True

[mypy-versions.*]
ignore_errors = True

[mypy-pg8000]
ignore_missing_imports = True

[mypy.plugins.sqlalchemy.ext.declarative.base]
enabled = True
